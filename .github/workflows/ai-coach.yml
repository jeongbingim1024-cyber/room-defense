name: AI coach (weekly balance report)
# 매주 월요일: 실제 유저 익명 기록을 받아 봇 데이터와 함께 다시 학습하고, 패치 추천 리포트를 Actions 요약에 올린다.
# 게임 파일은 바꾸지 않는다 (적용은 사람이 리포트를 보고 train.py --apply 로).
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy
      - name: Fetch real runs
        run: python3 tools/ai-coach/fetch_runs.py tools/ai-coach/runs.jsonl || echo "기록을 못 받았어요 (규칙 게시 전이면 정상)"
      - name: Train
        run: |
          cd tools/ai-coach
          ARGS=""; [ -s runs.jsonl ] && ARGS="--real runs.jsonl"
          python3 train.py data/bot_*.jsonl data/auto_*.jsonl $ARGS
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-coach-report
          path: |
            tools/ai-coach/report.md
            tools/ai-coach/ai_model.json
